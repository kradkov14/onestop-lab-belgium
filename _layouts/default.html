<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if site.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
  {% seo title=false %}
  <title>{% if page.title and page.layout != 'lab' %}{{ page.title }} · {% endif %}{{ site.data.lab.name }} · OneSTOP</title>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="{{ site.data.lab.logo | default: '/assets/img/onestop-logo.svg' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
